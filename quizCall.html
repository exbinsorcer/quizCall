<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title -->
    <title>QuizCall</title>
    
    <!-- Link to external CSS file for all styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- ============================================================
         DASHBOARD PAGE
         Shows buttons in order: Start, Create, Edit, Print
         ============================================================ -->
    <div class="page dashboard-page" id="dashboard">
        <button class="back-to-main-btn" id="backToMainDashboardBtn">← Back</button>
        
        <!-- Dashboard title -->
        <h1 style="text-align: center; margin-bottom: 10px; font-family: 'Naluka', Arial, sans-serif;">QuizCall</h1>
        
        <!-- Subtitle text -->
        <p class="subtitle" style="text-align: center; margin-bottom: 35px;">Create engaging quizzes, track progress, and master any subject</p>
        
        <!-- Container for the main buttons -->
        <div class="dashboard-buttons" style="max-width: 620px; margin: 0 auto;">
            <!-- Button to navigate to Start/Take Quiz page -->
            <button class="primary-button" id="startQuizBtn">
                🚀 Start
            </button>

            <!-- Button to navigate to Create Quiz page -->
            <button class="primary-button" id="createQuizBtn">
                ✏️ Create
            </button>
            
            <!-- Button to navigate to Edit Quiz page -->
            <button class="primary-button" id="editQuizBtn">
                📝 Edit
            </button>

            <!-- Button to navigate to Print Quiz page -->
            <button class="primary-button" id="printQuizBtn">
                🖨️ Print
            </button>
        </div>
    </div>
    
    <!-- ============================================================
         CREATE QUIZ PAGE
         Page for creating new quizzes with questions and answers
         ============================================================ -->
    <div class="page" id="createQuizSection" style="display: none;">
        
        <!-- Back button to return to dashboard -->
        <button class="secondary-button" id="backFromCreateBtn" style="margin-bottom: 20px;">
            ← Back to Dashboard
        </button>
        
        <!-- Top bar with title input centered -->
        <div class="top-bar">
            <!-- Left spacer -->
            <div class="top-bar-spacer"></div>
            
            <!-- Title input field - Centered -->
            <input 
                type="text" 
                id="quizTitle" 
                class="title-input" 
                placeholder="Quiz Title"
            >
            
            <!-- Right spacer -->
            <div class="top-bar-spacer"></div>
        </div>

        <!-- Folder input -->
        <div class="creator-container" style="margin-bottom: 20px;">
            <label for="quizFolder" style="display: block; margin-bottom: 8px; font-weight: 600;">
                📁 Quiz Folder/Category (Optional)
            </label>
            <input 
                type="text" 
                id="quizFolder" 
                class="category-input" 
                placeholder="e.g., Electrical, Physics, Math (Leave blank for no folder)"
            >
        </div>
        
        <!-- Main container for quiz creation -->
        <div class="creator-container">
            <!-- Container for all questions - Will be populated dynamically -->
            <div id="questionsContainer">
                <!-- Questions will be added here dynamically -->
            </div>
            
            <!-- Button to add a new question-answer pair -->
            <button class="add-button" id="addQuestionBtn">
                + Add Question
            </button>
        </div>
        
        <!-- Save button - Located in bottom right (fixed position in CSS) -->
        <button class="save-button" id="saveQuizBtn">
            SAVE
        </button>
    </div>

    <!-- ============================================================
         EDIT QUIZ PAGE
         Page for editing existing quizzes
         ============================================================ -->
    <div class="page" id="editQuizSection" style="display: none;">
        
        <!-- Back button to return to dashboard -->
        <button class="secondary-button" id="backFromEditBtn" style="margin-bottom: 20px;">
            ← Back to Dashboard
        </button>
        
        <!-- Header with title -->
        <div class="simple-header">
            <h1>Edit or Delete Your Quiz</h1>
            <p>Select a quiz to edit or delete</p>
        </div>
        
        <!-- Container for quiz list - Will be populated dynamically -->
        <div class="quiz-library" id="editQuizzesList">
            <!-- Quizzes will be added here dynamically -->
        </div>
    </div>

    <!-- ============================================================
         QUIZ EDITOR PAGE
         Page for editing a specific quiz
         ============================================================ -->
    <div class="page" id="quizEditorSection" style="display: none;">
        
        <!-- Back button to return to edit quiz list -->
        <button class="secondary-button" id="backFromQuizEditorBtn" style="margin-bottom: 20px;">
            ← Back to Edit Selection
        </button>
        
        <!-- Top bar with title input centered -->
        <div class="top-bar">
            <!-- Left spacer -->
            <div class="top-bar-spacer"></div>
            
            <!-- Title input field - Centered -->
            <input 
                type="text" 
                id="editingQuizTitle" 
                class="title-input" 
                placeholder="Quiz Title"
            >
            
            <!-- Right spacer -->
            <div class="top-bar-spacer"></div>
        </div>

        <!-- Folder input for editing -->
        <div class="creator-container" style="margin-bottom: 20px;">
            <label for="editingQuizFolder" style="display: block; margin-bottom: 8px; font-weight: 600;">
                📁 Quiz Folder/Category (Optional)
            </label>
            <input 
                type="text" 
                id="editingQuizFolder" 
                class="category-input" 
                placeholder="e.g., Electrical, Physics, Math (Leave blank for no folder)"
            >
        </div>
        
        <!-- Main container for quiz editing -->
        <div class="creator-container">
            <!-- Container for all questions - Will be populated dynamically -->
            <div id="editingQuestionsContainer">
                <!-- Questions will be added here dynamically -->
            </div>
            
            <!-- Button to add a new question-answer pair -->
            <button class="add-button" id="addEditQuestionBtn">
                + Add Question
            </button>
        </div>
        
        <!-- Save button - Located in bottom right (fixed position in CSS) -->
        <button class="save-button" id="saveEditQuizBtn">
            SAVE CHANGES
        </button>
    </div>
    
    <!-- ============================================================
         START QUIZ PAGE
         Page displaying all saved quizzes organized by folders
         ============================================================ -->
    <div class="page" id="startQuizSection" style="display: none;">
        
        <!-- Back button to return to dashboard -->
        <button class="secondary-button" id="backFromStartBtn" style="margin-bottom: 20px;">
            ← Back to Dashboard
        </button>
        
        <!-- Header with title -->
        <div class="simple-header">
            <h1>Available Quizzes</h1>
            <p>Choose a quiz to get started</p>
        </div>
        
        <!-- Container for quiz list - Will be populated dynamically -->
        <div class="quiz-library" id="quizzesList">
            <!-- Quizzes will be added here dynamically -->
        </div>
    </div>

    <!-- ============================================================
         PRINT QUIZ PAGE
         Page for selecting and printing quizzes
         ============================================================ -->
    <div class="page" id="printQuizSection" style="display: none;">
        
        <!-- Back button to return to dashboard -->
        <button class="secondary-button" id="backFromPrintBtn" style="margin-bottom: 20px;">
            ← Back to Dashboard
        </button>
        
        <!-- Header with title -->
        <div class="simple-header">
            <h1>Download Quizzes</h1>
            <p>Select a quiz to download as text file</p>
        </div>
        
        <!-- Container for quiz list - Will be populated dynamically -->
        <div class="quiz-library" id="printQuizzesList">
            <!-- Quizzes will be added here dynamically -->
        </div>
    </div>
    
    <!-- ============================================================
         QUIZ TAKING PAGE
         Page for answering quiz questions
         ============================================================ -->
    <div class="page" id="quizTakingSection" style="display: none;">
        
        <!-- Back button to return to quiz list -->
        <button class="secondary-button" id="backFromQuizBtn" style="margin-bottom: 20px;">
            ← Back to Quizzes
        </button>
        
        <!-- Quiz header with title and progress -->
        <div class="quiz-header">
            <div>
                <h1 id="quizTitle-display">Quiz Title</h1>
                <p id="quizProgress">Question 1 of 10</p>
            </div>
        </div>
        
        <!-- Quiz content area -->
        <div class="quiz-area">
            <!-- Question card - Will be populated dynamically -->
            <div class="quiz-question-card" id="questionDisplay">
                <!-- Question content will be populated here -->
            </div>
        </div>
        
        <!-- Navigation buttons for quiz questions -->
        <div class="quiz-navigation">
            <button class="secondary-button" id="prevQuestionBtn">← Previous</button>
            <button class="secondary-button" id="nextQuestionBtn">Next →</button>
            <button class="primary-button" id="finishQuizBtn" style="display: none;">
                Finish Quiz
            </button>
        </div>
    </div>
    
    <!-- ============================================================
         QUIZ RESULTS PAGE
         Page displaying quiz results and score with review
         ============================================================ -->
    <div class="page" id="quizResultsSection" style="display: none;">
        
        <!-- Back button to return to dashboard -->
        <button class="secondary-button" id="backFromResultsBtn" style="margin-bottom: 20px;">
            ← Back to Dashboard
        </button>
        
        <!-- Results content - Will be populated dynamically -->
        <div class="result-area" id="resultsContent">
            <!-- Results will be populated here -->
        </div>
    </div>
    
    <!-- ============================================================
         NOTIFICATION / TOAST
         Temporary message that appears at bottom of screen
         ============================================================ -->
    <div class="toast" id="notification">
        <!-- Notification message will be populated here -->
    </div>
    
    <!-- ============================================================
         SCRIPT FILES
         Loaded in order of dependency
         ============================================================ -->
    
    <!-- Storage utility for localStorage operations -->
    <script src="storage.js"></script>
    
    <!-- UI utility functions -->
    <script src="ui.js"></script>
    
    <!-- Create Quiz functionality -->
    <script src="createQuiz.js"></script>

    <!-- Edit Quiz functionality -->
    <script src="editQuiz.js"></script>
    
    <!-- Start Quiz and Quiz Taking functionality -->
    <script src="startQuiz.js"></script>

    <!-- Print Quiz functionality -->
    <script src="printQuiz.js"></script>
    
    <!-- Main application logic and event listeners -->
    <script src="app.js"></script>

    <!-- Theme sync from main dashboard -->
    <script>
        // Apply saved theme from localStorage
        const savedTheme = localStorage.getItem('app-theme') || 'light-theme';
        document.body.className = savedTheme;
    </script>
</body>
</html>
