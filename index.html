<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizCall - Main</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <!-- MAIN DASHBOARD -->
    <div class="page main-dashboard-page" id="mainDashboard">
        <button class="dark-mode-toggle-btn" id="darkModeToggle">🌙</button>
        
        <h1 style="position: absolute; top: 30px; left: 50%; transform: translateX(-50%); margin: 0; font-size: 48px; font-family: 'Naluka', Arial, sans-serif; font-weight: bold; letter-spacing: 2px;">DASHBOARD</h1>
        
        <div class="main-dashboard-card" style="margin-top: 80px;">
            <div class="main-dashboard-buttons">
                <button class="main-dashboard-btn study-btn" id="studyBtn">📚 Study</button>
                <button class="main-dashboard-btn eat-btn" id="eatBtn">🍽️ Eat</button>
                <button class="main-dashboard-btn reminders-btn" id="remindersBtn">⏰ Reminders</button>
            </div>
        </div>
    </div>

    <!-- EAT DASHBOARD (Placeholder for future) -->
    <div class="page eat-dashboard-page" id="eatDashboard" style="display: none;">
        <button class="back-to-main-btn" id="backToMainFromEatBtn">← Back</button>
        <div class="eat-dashboard-card">
            <h1>Nutrition</h1>
            <div class="eat-buttons">
                <button class="eat-btn-item" id="dailyIntakeBtn">📊 Daily Intake</button>
                <button class="eat-btn-item" id="progressBtn">📈 Progress</button>
            </div>
        </div>
    </div>

    <!-- DAILY INTAKE PAGE -->
    <div class="page daily-intake-page" id="dailyIntakePage" style="display: none;">
        <button class="back-to-main-btn" id="backFromDailyIntakeBtn">← Back</button>
        
        <div class="intake-card">
            <h1>Daily Intake</h1>
            
            <!-- Date input -->
            <div class="intake-form">
                <div class="form-group">
                    <label for="intakeDate">📅 Date</label>
                    <input type="date" id="intakeDate" class="intake-input">
                </div>
                
                <!-- Calories -->
                <div class="form-group">
                    <label for="caloriesInput">🔥 Calories</label>
                    <input type="number" id="caloriesInput" class="intake-input" placeholder="0" min="0">
                </div>
                
                <!-- Protein -->
                <div class="form-group">
                    <label for="proteinInput">💪 Protein (g)</label>
                    <input type="number" id="proteinInput" class="intake-input" placeholder="0" min="0">
                </div>
                
                <!-- Carbs -->
                <div class="form-group">
                    <label for="carbsInput">🌾 Carbs (g)</label>
                    <input type="number" id="carbsInput" class="intake-input" placeholder="0" min="0">
                </div>
                
                <!-- Save Button -->
                <button class="save-intake-btn" id="saveIntakeBtn">💾 Save Entry</button>
            </div>
        </div>
    </div>

    <!-- REMINDERS PAGE -->
    <div class="page reminders-page" id="remindersPage" style="display: none;">
        <button class="back-to-main-btn" id="backFromRemindersBtn">← Back</button>
        
        <div class="reminders-card">
            <h1>Reminders</h1>
            <p class="reminders-date" id="remindersDate"></p>
            
            <div class="reminders-form">
                <div class="form-group">
                    <label for="reminderInput">Add Reminder</label>
                    <input type="text" id="reminderInput" class="reminder-input" placeholder="Type reminder...">
                </div>
                <button class="reminder-add-btn" id="reminderAddBtn">➕ Add</button>
            </div>
            
            <div class="reminders-list" id="remindersList">
                <!-- Reminders will appear here -->
            </div>
        </div>
    </div>

    <div class="toast" id="notification"></div>

    <script src="nutrition.js"></script>
    <script src="mainDashboard.js"></script>
</body>
</html>
