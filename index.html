<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title -->
    <title>Quiz App</title>
    
    <!-- Link to external CSS file for all styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- ============================================================
         DASHBOARD PAGE
         Shows two buttons: Create Your Quiz and Start Your Quiz
         ============================================================ -->
    <div class="page dashboard-page" id="dashboard">
        <div class="dashboard-card">
            <!-- Dashboard title -->
            <h1>Quiz App</h1>
            
            <!-- Subtitle text -->
            <p class="subtitle">Create custom quizzes and test your knowledge</p>
            
            <!-- Container for the two main buttons -->
            <div class="dashboard-buttons">
                <!-- Button to navigate to Create Quiz page -->
                <button class="primary-button" id="createQuizBtn">
                    Create Your Quiz
                </button>
                
                <!-- Button to navigate to Start/Take Quiz page -->
                <button class="secondary-button" id="startQuizBtn">
                    Start Your Quiz
                </button>
            </div>
        </div>
    </div>
    
    <!-- ============================================================
         CREATE QUIZ PAGE
         Page for creating new quizzes with questions and answers
         ============================================================ -->
    <div class="page" id="createQuizSection" style="display: none;">
        
        <!-- Back button to return to dashboard -->
        <button class="secondary-button" id="backFromCreateBtn" style="margin-bottom: 20px;">
            ← Back to Dashboard
        </button>
        
        <!-- Top bar with title input centered -->
        <div class="top-bar">
            <!-- Left spacer -->
            <div class="top-bar-spacer"></div>
            
            <!-- Title input field - Centered -->
            <input 
                type="text" 
                id="quizTitle" 
                class="title-input" 
                placeholder="Quiz Title"
            >
            
            <!-- Right spacer -->
            <div class="top-bar-spacer"></div>
        </div>
        
        <!-- Main container for quiz creation -->
        <div class="creator-container">
            <!-- Container for all questions - Will be populated dynamically -->
            <div id="questionsContainer">
                <!-- Questions will be added here dynamically -->
            </div>
            
            <!-- Button to add a new question-answer pair -->
            <button class="add-button" id="addQuestionBtn">
                + Add Question
            </button>
        </div>
        
        <!-- Save button - Located in bottom right (fixed position in CSS) -->
        <button class="save-button" id="saveQuizBtn">
            SAVE
        </button>
    </div>
    
    <!-- ============================================================
         START QUIZ PAGE
         Page displaying all saved quizzes
         ============================================================ -->
    <div class="page" id="startQuizSection" style="display: none;">
        
        <!-- Back button to return to dashboard -->
        <button class="secondary-button" id="backFromStartBtn" style="margin-bottom: 20px;">
            ← Back to Dashboard
        </button>
        
        <!-- Header with title -->
        <div class="simple-header">
            <h1>Available Quizzes</h1>
            <p>Choose a quiz to get started</p>
        </div>
        
        <!-- Container for quiz list - Will be populated dynamically -->
        <div class="quiz-library" id="quizzesList">
            <!-- Quizzes will be added here dynamically -->
        </div>
    </div>
    
    <!-- ============================================================
         QUIZ TAKING PAGE
         Page for answering quiz questions
         ============================================================ -->
    <div class="page" id="quizTakingSection" style="display: none;">
        
        <!-- Back button to return to quiz list -->
        <button class="secondary-button" id="backFromQuizBtn" style="margin-bottom: 20px;">
            ← Back to Quizzes
        </button>
        
        <!-- Quiz header with title and progress -->
        <div class="quiz-header">
            <div>
                <h1 id="quizTitle-display">Quiz Title</h1>
                <p id="quizProgress">Question 1 of 10</p>
            </div>
        </div>
        
        <!-- Quiz content area -->
        <div class="quiz-area">
            <!-- Question card - Will be populated dynamically -->
            <div class="quiz-question-card" id="questionDisplay">
                <!-- Question content will be populated here -->
            </div>
        </div>
        
        <!-- Navigation buttons for quiz questions -->
        <div class="quiz-navigation">
            <button class="secondary-button" id="prevQuestionBtn">← Previous</button>
            <button class="secondary-button" id="nextQuestionBtn">Next →</button>
            <button class="primary-button" id="finishQuizBtn" style="display: none;">
                Finish Quiz
            </button>
        </div>
    </div>
    
    <!-- ============================================================
         QUIZ RESULTS PAGE
         Page displaying quiz results and score
         ============================================================ -->
    <div class="page" id="quizResultsSection" style="display: none;">
        
        <!-- Back button to return to dashboard -->
        <button class="secondary-button" id="backFromResultsBtn" style="margin-bottom: 20px;">
            ← Back to Dashboard
        </button>
        
        <!-- Results content - Will be populated dynamically -->
        <div class="result-area" id="resultsContent">
            <!-- Results will be populated here -->
        </div>
    </div>
    
    <!-- ============================================================
         NOTIFICATION / TOAST
         Temporary message that appears at bottom of screen
         ============================================================ -->
    <div class="toast" id="notification">
        <!-- Notification message will be populated here -->
    </div>
    
    <!-- ============================================================
         SCRIPT FILES
         Loaded in order of dependency
         ============================================================ -->
    
    <!-- Storage utility for localStorage operations -->
    <script src="storage.js"></script>
    
    <!-- UI utility functions -->
    <script src="ui.js"></script>
    
    <!-- Create Quiz functionality -->
    <script src="createQuiz.js"></script>
    
    <!-- Start Quiz and Quiz Taking functionality -->
    <script src="startQuiz.js"></script>
    
    <!-- Main application logic and event listeners -->
    <script src="app.js"></script>
</body>
</html>
